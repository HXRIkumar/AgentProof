[project]
name = "agentproof"
version = "0.5.0"
description = "A self-correcting LLM answer runtime with reproducible quality and efficiency evaluation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "langgraph>=1,<2",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6", "torch>=2.10,<2.11"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
