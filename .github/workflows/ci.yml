name: Agent release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          python-version: '3.12'
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: npm ci && npm test && npm run build
        working-directory: web
      - name: Paired fixture release gate
        run: |
          .venv/bin/uvicorn agentproof.api:app --port 8010 > /tmp/agentproof.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8010/api/ready && break
            sleep 1
          done
          uv run python scripts/benchmark.py --output artifacts/ci-fixture --require-gate
          uv run python scripts/benchmark.py --suite examples/challenge-suite-v1.json --output artifacts/ci-challenge --require-gate
          uv run python scripts/compare.py reports/fixture-v1.json artifacts/ci-fixture.json --output artifacts/ci-comparison
      - name: Browser workflow regression
        env:
          PLAYWRIGHT_CHANNEL: chromium
          SCREENSHOT_DIR: artifacts/browser
        run: |
          uv run --with playwright==1.64.0 python -m playwright install --with-deps chromium
          uv run --with playwright==1.64.0 python web/qa/browser_smoke.py
          uv run --with playwright==1.64.0 python web/qa/async_smoke.py
          uv run --with playwright==1.64.0 python web/qa/comparison_smoke.py
          uv run --with playwright==1.64.0 python web/qa/archive_smoke.py
          uv run --with playwright==1.64.0 python web/qa/answer_smoke.py
          uv run --with playwright==1.64.0 python web/qa/support_smoke.py
      - name: Recorded-only static build and browser checks
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          npm --prefix web run build:recorded
          uv run python scripts/build_static_evidence.py
          uv run python scripts/build_answer_evidence.py
          uv run python scripts/build_support_demo.py
          uv run --with playwright==1.64.0 python web/qa/static_smoke.py
          uv run --with playwright==1.64.0 python web/qa/static_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-evidence
          path: artifacts/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build -t agentproof:ci .
      - name: Exercise container API and persisted evidence
        run: |
          mkdir -p artifacts
          docker run -d --name agentproof-ci -p 127.0.0.1:8010:8010 agentproof:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8010/api/ready && break
            sleep 1
          done
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          origin = 'http://127.0.0.1:8010'
          def read(path):
              return json.load(urllib.request.urlopen(origin + path))
          assert read('/api/experiments') == []
          assert read('/api/config')['live_configured'] is False
          catalog = read('/api/evidence')
          assert len(catalog) == 5 and all(item['available'] for item in catalog)
          for item in catalog:
              envelope = read('/api/evidence/' + item['id'])
              raw = urllib.request.urlopen(origin + envelope['archive']['download_url']).read()
              assert hashlib.sha256(raw).hexdigest() == item['sha256']
              assert envelope['archive']['read_only'] is True
              assert envelope['experiment']['summary']['total_runs'] == item['trial_count']
          assert read('/api/experiments') == []
          Path('artifacts/container-archive.json').write_text(json.dumps({
              'archives': catalog, 'workspace_experiments': 0,
              'live_provider_configured': False, 'status': 'passed'
          }, indent=2))
          print('Empty container database can inspect all five hash-verified historical reports without a model')
          PY
          python3 web/qa/answer_container_archives.py
          python3 web/qa/support_container.py prepare
          docker exec agentproof-ci /app/.venv/bin/python -c "import os,sqlite3; db=sqlite3.connect(os.environ['AGENTPROOF_DB']); assert db.execute('SELECT COUNT(*) FROM runs').fetchone()[0] == 0; assert db.execute('SELECT COUNT(*) FROM experiments').fetchone()[0] == 0; print('Archive inspection left the container run journal empty')"
          python3 scripts/benchmark.py --background --output artifacts/container-fixture --require-gate
          python3 scripts/benchmark.py --background --suite examples/challenge-suite-v1.json --output artifacts/container-challenge --require-gate
          docker restart agentproof-ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8010/api/ready && break
            sleep 1
          done
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path
          before = json.loads(Path('artifacts/container-challenge.json').read_text())
          after = json.load(urllib.request.urlopen('http://127.0.0.1:8010/api/experiments/' + before['id']))
          assert after['status'] == 'completed' and len(after['runs']) == 60
          assert after['summary']['gate']['passed']
          assert before['runs'] == after['runs']
          print('Container restart preserved all 60 challenge trial records')
          PY
          python3 web/qa/support_container.py verify
      - name: Save container logs
        if: always()
        run: |
          mkdir -p artifacts
          docker logs agentproof-ci > artifacts/container.log 2>&1 || true
          docker rm -f agentproof-ci || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: artifacts/
